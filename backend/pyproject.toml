[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coder-backend"
version = "0.1.0"
description = "AI Coder backend: HTTP API, orchestration, storage, and MCP tools"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5,<2",
    "langgraph>=1.2,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
    "httpx>=0.28,<1",
    "google-genai>=2.0,<3",
    # MCP Python SDK. Pinned below 2.0: v2 renamed FastMCP to MCPServer, and
    # the team docs and code use the v1 FastMCP API.
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Import `ai_coder` from src/ without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]
